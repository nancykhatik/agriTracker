
name: Docker CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Tests
        run: python manage.py test

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agritracker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/agritracker:${{ github.sha }}

  deploy-local:
    name: Deploy on Local Ubuntu
    runs-on: self-hosted
    needs: build-and-push
    if: github.event_name != 'pull_request'

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Latest Docker Image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/agritracker:latest

      - name: Stop Old Container
        run: |
          docker rm -f agritracker-app || true

      - name: Run AgriTracker Container
        run: |
          docker run -d \
            --name agritracker-app \
            -p 8000:8000 \
            --restart unless-stopped \
            ${{ secrets.DOCKERHUB_USERNAME }}/agritracker:latest \
            python manage.py runserver 0.0.0.0:8000

      - name: Verify Deployment
        run: |
          docker ps
          docker logs --tail 50 agritracker-app
